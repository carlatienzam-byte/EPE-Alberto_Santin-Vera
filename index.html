<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
     <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
     <script src="https://unpkg.com/aframe-event-set-component@5.x.x/dist/aframe-event-set-component.min.js"></script>
	    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.2/dist/aframe-extras.min.js"></script>
</head>
<body>
    <!-- animation="property: rotation; to: 0 360 0; loop: true; dur: 700000; easing: linear" -->
    <a-scene>

         <!-- Inicio entidad completa para camara y movimiento -->
             <a-entity
        id="playerRig"
        position="0 0 0"
        movement-controls="speed: 0.3; fly: false;"
        universal-controls="movementEnabled: true;"
      >
         <!-- Controlador mano derecha -->
      <a-entity
  id="rightHand"
  laser-controls="hand: right"
  raycaster="objects: .clickable"
  cursor="fuse: false; rayOrigin: entity"
  oculus-touch-controls="hand: right">
</a-entity>

      <!-- Controlador mano izquierda (opcional) -->
    <a-entity
  id="leftHand"
  laser-controls="hand: left"
  raycaster="objects: .clickable"
  cursor="fuse: false; rayOrigin: entity"
  oculus-touch-controls="hand: left">
</a-entity>
         
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
         </a-entity>
<!-- Fin entidad completa -->
       


        <a-gltf-model id="Mazda" src="low_poly_mazda_mx-5_miata_na_update_opt.glb" rotation="0 -90 0" position="-5 0 2" scale="1 1 1" sound="src: #Rotativo; on:mouseenter"></a-gltf-model>
        <a-gltf-model id="Gasolinera" src="retro-futuristic_gas_station_opt.glb" position="0 0 0" scale="1 1 1"></a-gltf-model>
        <a-gltf-model id="Camion" src="truck_opt.glb" rotation="0 -20 0" position="-29 2.3 20" scale="1 1 1" sound="src: #Camion1; on:mouseenter"></a-gltf-model>
        <a-gltf-model id="Sol1" src="Sol_opt.glb" position="-120 200 160" opacity="0.5" scale="0.5 0.5 0.5"></a-gltf-model>
        <a-gltf-model id="Cielo" src="cielo_opt.glb" position="0 0 0" scale="300 300 300"></a-gltf-model>
        
        <a-cylinder color="red" position="0 1 4.34" scale="0.2 0.2 0.2" event-set__enter="_event: mouseenter; color: green" event-set__leave="_event: mouseleave; color: red" ></a-cylinder>


        <a-light id="Sol2" type="point" color="#FFFFFF" position="-120 200 160" intensity="1000"></a-light>
        <a-light id="ambiente" type="ambient" color="#FFFFFF" intensity="1"></a-light>
        <a-light id="Gasolinera1" type="point" color="#F0E68C" position="14.6 7.3 14.4" intensity="30"></a-light>
        <a-light id="Gasolinera2" type="point" color="#F0E68C" position="14.6 7.3 2.5" intensity="30"></a-light>
        <a-light id="Gasolinera3" type="point" color="#F0E68C" position="14.6 7.3 26.6" intensity="30"></a-light>
        <a-light id="Gasolinera4" type="point" color="#F0E68C" position="-0.3 7.3 14.4" intensity="30"></a-light>
        <a-light id="Gasolinera5" type="point" color="#F0E68C" position="-0.3 7.3 2.5" intensity="30"></a-light>
        <a-light id="Gasolinera6" type="point" color="#F0E68C" position="-0.3 7.3 26.6" intensity="30"></a-light>
  

        <a-assets>
            <a-sound id="Rotativo" src="rotativo.mp3"></a-sound>
            <a-sound id="Camion1"   src="camion.mp3"  ></a-sound>
        </a-assets>
        

        <a-box position="-27 0 20" scale="1 1 1" color="red" rotation="0 -20 0 "
            event-set__enter="_event: mouseenter; _target: #cartel; visible: true"
            event-set__leave="_event: mouseleave; _target: #cartel; visible: false">
            <a-box id="cartel" src="image-12-768x432-1.png" color="#FFFFFF" visible="false" position="1 3 0" scale=" 0 4 8"></a-box>
        </a-box>
		
		<a-link id="miEnlace1"  
			    class="clickable" 
			    src="backrooms.jpg" 
			    href="https://carlatienzam-byte.github.io/EPE-IESCarmen-de-Burgos/" 
			    title="Backrooms" position="19.26834 1.027 13.99184" 
			    scale="0.5 0.5 0.5" 
			    geometry="primitive: circle; segments: 64" 
			    material="shader: portal; side: double; previewDistance: 7.5" 
			    rotation="0 89.99999999999999 0">
			<a-entity 
			   text="align: center; color: white; font: kelsonsans; value: Backrooms; width: 5" 
			   position="0 1.5 0" 
			   rotation="0 180 0">
		    </a-entity>
		</a-link>


    </a-scene>
	
<script>
let currentTransition = false;

// 🔥 Fade overlay
const fade = document.createElement('a-plane');
fade.setAttribute('position', '0 0 -0.5');
fade.setAttribute('width', '5');
fade.setAttribute('height', '5');
fade.setAttribute('material', 'color: black; opacity: 0');
fade.setAttribute('class', 'fade');
document.querySelector('a-scene').appendChild(fade);

function fadeOutIn(callback) {
  if (currentTransition) return;
  currentTransition = true;

  fade.setAttribute('animation', {
    property: 'material.opacity',
    to: 1,
    dur: 300
  });

  setTimeout(() => {
    callback();

    fade.setAttribute('animation', {
      property: 'material.opacity',
      to: 0,
      dur: 500
    });

    setTimeout(() => {
      currentTransition = false;
    }, 500);

  }, 300);
}

// 🔥 SOLO efecto hover (sin salir de VR)
function setupVRLink(id, url) {
  const el = document.querySelector(id);

  el.addEventListener('mouseenter', () => {
    el.setAttribute('scale', '0.7 0.7 0.7');
  });

  el.addEventListener('mouseleave', () => {
    el.setAttribute('scale', '0.5 0.5 0.5');
  });

  el.addEventListener('click', () => {

    fadeOutIn(() => {
      // ✔ OPCIÓN SEGURA VR:
      // abre en nueva pestaña SIN romper VR
      window.open(url, '_blank');
    });

  });
}

// links
function setupVRLink(id, url) {
  const el = document.querySelector(id);

  if (!el) return;

  // ✔ hover VR real (raycaster)
  el.addEventListener('raycaster-intersected', () => {
    el.setAttribute('scale', '0.7 0.7 0.7');
  });

  el.addEventListener('raycaster-intersected-cleared', () => {
    el.setAttribute('scale', '0.5 0.5 0.5');
  });

  // ✔ click VR (trigger del controlador)
  el.addEventListener('click', () => {
    window.open(url, '_blank');
  });
}
	setupVRLink('#miEnlace1',
"https://carlatienzam-byte.github.io/EPE-IESCarmen-de-Burgos/");

	el.addEventListener('click', () => {
  el.setAttribute('animation__click', {
    property: 'scale',
    to: '0.4 0.4 0.4',
    dur: 100,
    dir: 'alternate'
  });

  window.open(url, '_blank');
});
</script>
</body>
</html>
